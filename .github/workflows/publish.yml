name: Publish Docker image

on:
  push:
    tags:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and push Docker image
        run: ./gradlew jib
        env:
          CONTAINER_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/sensors
          CI_DEPLOY_USER: ${{ github.actor }}
          CI_DEPLOY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
